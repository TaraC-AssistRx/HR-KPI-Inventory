<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR KPI Dashboard</title>
<style>
:root{color-scheme:light;--ink:#1c2430;--mut:#6b7686;--line:#e3e7ee;--bg:#f5f7fa;--card:#fff;--brand:#2b5fd9;--brand2:#e8eefc;--g:#1f9d63;--y:#e0a100;--r:#d64545;--tc:#2b5fd9;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px 0;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
header h1 small{font-weight:400;color:var(--mut);font-size:12px}
nav{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
nav button{border:0;background:none;padding:9px 14px;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;font-weight:600}
nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
.sub{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.sub button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 13px;font-size:12px;cursor:pointer;color:var(--mut);font-weight:600}
.sub button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
main{padding:20px 24px;max-width:1280px;margin:0 auto}
h2{font-size:15px;margin:22px 0 4px}
h2:first-child{margin-top:0}
.note{color:var(--mut);font-size:12px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .lab{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .val{font-size:28px;font-weight:700;margin:6px 0 2px}
.card .val.na{color:#b4bcc9;font-size:22px;font-weight:600}
.card .s{font-size:12px;color:var(--mut)}
.card .tgt{font-size:11px;color:var(--mut);margin-top:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.b{font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
.b.kpi{background:#e3f4ec;color:#157a4b}.b.prop{background:#fff3d6;color:#8a6200}.b.trk{background:#eceff4;color:#566175}.b.ph{background:#fdecec;color:#a33}
.chartcard h3{margin:0 0 2px;font-size:13px}
.chartcard .note{margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px}
.coe{cursor:pointer}
.coe:hover{border-color:var(--brand)}
.coe h3{margin:0 0 8px;font-size:14px}
.bar{height:6px;background:#eceff4;border-radius:3px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--brand)}
.ph-box{border:1px dashed #c6cdd9;border-radius:10px;padding:26px;text-align:center;color:var(--mut);background:#fafbfc}
.legend{font-size:11px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.flag{background:#fff8e6;border:1px solid #f3dca0;border-radius:8px;padding:8px 12px;font-size:12px;color:#6d5300;margin-bottom:12px}
ul.m{margin:6px 0 0;padding-left:18px;color:var(--mut);font-size:12px}

.pbar{display:flex;gap:6px;margin-left:auto}
.pbar button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink);font-weight:600}
.pbar button:hover{background:var(--brand2)}
.psec{margin:0 0 6px;padding-bottom:6px;border-bottom:2px solid var(--brand);font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
@page{size:letter landscape;margin:.4in}
@media print{
 body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 header nav,.pbar,.sub{display:none!important}
 header{position:static;border:0;padding:0 0 8px}
 main{padding:0;max-width:none}
 .card,.flag,table tr{break-inside:avoid}
 .pgbrk{break-before:page}
 .pgbrk:first-child{break-before:auto}
}
</style>
</head>

</header>

// status: only when target set. dir 'up' = higher is better
function rag(val,t){ if(val==null||!t) return null;
  const up=t.dir!=='down'; const ok=up?val>=t.green:val<=t.green; if(ok) return 'var(--g)';
  const mid=up?val>=t.yellow:val<=t.yellow; return mid?'var(--y)':'var(--r)'; }

function card(c){
  const b=BADGE[c.type||'trk'];
  const na=c.value==null;
  const col=rag(c.raw,c.target);
  return `<div class="card"><div class="lab"><span>${col?`<span class="dot" style="background:${col}"></span>`:''}${c.label}</span><span class="b ${b[0]}">${b[1]}</span></div>
  <div class="val ${na?'na':''}">${na?'No data yet':c.value}</div>
  <div class="s">${c.sub||'&nbsp;'}</div>${c.target?`<div class="tgt">Target: ${c.target.label}</div>`:''}</div>`;
}
const cards=a=>`<div class="grid">${a.map(card).join('')}</div>`;

/* SVG charts */
function lineChart(labels,series,{h=190,f=fmt.n,colors=['#2b5fd9','#e0a100','#1f9d63','#d64545']}={}){
  const W=520,H=h,p={l:48,r:12,t:12,b:26};
  const all=series.flatMap(s=>s.data.filter(x=>x!=null)); const max=Math.max(...all)*1.1||1;
  const x=i=>p.l+(W-p.l-p.r)*(labels.length<2?.5:i/(labels.length-1));
  const y=v=>H-p.b-(H-p.t-p.b)*v/max;
  let g='';
  for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e8ebf0"/><text x="${p.l-6}" y="${y(v)+3}" font-size="10" fill="#6b7686" text-anchor="end">${f(v)}</text>`}
  labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${H-8}" font-size="10" fill="#6b7686" text-anchor="middle">${l}</text>`);
  series.forEach((s,si)=>{const pts=s.data.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
    g+=`<polyline fill="none" stroke="${colors[si]}" stroke-width="2.2" points="${pts.map(q=>q.join(',')).join(' ')}"/>`+pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="2.8" fill="${colors[si]}"/>`).join('');
    const lp=last(pts); if(lp) g+=`<text x="${lp[0]}" y="${lp[1]-7}" font-size="10" font-weight="700" fill="${colors[si]}" text-anchor="end">${f(last(s.data))}</text>`});
  const lg=series.length>1?`<div class="legend">${series.map((s,i)=>`<span><span class="dot" style="background:${colors[i]}"></span>${s.name}</span>`).join('')}</div>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>${lg}`;
}
function barChart(labels,data,{h=190,f=fmt.n,color='#2b5fd9'}={}){
  const W=520,H=h,p={l:48,r:12,t:16,b:26}; const max=Math.max(...data)*1.15||1;
  const bw=(W-p.l-p.r)/labels.length; const y=v=>H-p.b-(H-p.t-p.b)*v/max; let g='';
  for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e8ebf0"/><text x="${p.l-6}" y="${y(v)+3}" font-size="10" fill="#6b7686" text-anchor="end">${f(v)}</text>`}
  data.forEach((v,i)=>{const bx=p.l+i*bw+bw*.15;g+=`<rect x="${bx}" y="${y(v)}" width="${bw*.7}" height="${H-p.b-y(v)}" rx="3" fill="${color}"/><text x="${bx+bw*.35}" y="${y(v)-4}" font-size="10" fill="#1c2430" text-anchor="middle">${f(v)}</text><text x="${bx+bw*.35}" y="${H-8}" font-size="10" fill="#6b7686" text-anchor="middle">${labels[i]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}

function divBarChart(labels,data,{h=190,f=v=>Math.round(v)}={}){
  const W=520,H=h,p={l:48,r:12,t:16,b:26}; const mx=Math.max(...data.map(Math.abs))*1.15||1;
  const y=v=>p.t+(H-p.t-p.b)*(1-(v+mx)/(2*mx)); const bw=(W-p.l-p.r)/labels.length; let g='';
  [-mx,0,mx].forEach(v=>g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#9aa4b2':'#e8ebf0'}"/><text x="${p.l-6}" y="${y(v)+3}" font-size="10" fill="#6b7686" text-anchor="end">${f(v)}</text>`);
  data.forEach((v,i)=>{const bx=p.l+i*bw+bw*.15,y0=y(0),y1=y(v);g+=`<rect x="${bx}" y="${Math.min(y0,y1)}" width="${bw*.7}" height="${Math.abs(y1-y0)}" rx="3" fill="${v<0?'#d64545':'#1f9d63'}"/><text x="${bx+bw*.35}" y="${v<0?y1+11:y1-4}" font-size="9" fill="#1c2430" text-anchor="middle">${f(v)}</text><text x="${bx+bw*.35}" y="${H-8}" font-size="10" fill="#6b7686" text-anchor="middle">${labels[i]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}

function stackBarChart(labels,series,{h=200}={}){
  const W=520,H=h,p={l:48,r:12,t:12,b:26}; const tot=labels.map((_,i)=>series.reduce((a,x)=>a+x.data[i],0)); const max=Math.max(...tot)*1.12||1;
  const bw=(W-p.l-p.r)/labels.length; const y=v=>H-p.b-(H-p.t-p.b)*v/max; let g='';
  for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e8ebf0"/><text x="${p.l-6}" y="${y(v)+3}" font-size="10" fill="#6b7686" text-anchor="end">${Math.round(v)}</text>`}
  labels.forEach((l,i)=>{let acc=0;const bx=p.l+i*bw+bw*.15;series.forEach(x=>{const v=x.data[i];if(v>0){g+=`<rect x="${bx}" y="${y(acc+v)}" width="${bw*.7}" height="${y(acc)-y(acc+v)}" fill="${x.color}"/>`;acc+=v}});
    g+=`<text x="${bx+bw*.35}" y="${y(tot[i])-4}" font-size="10" fill="#1c2430" text-anchor="middle">${tot[i]}</text><text x="${bx+bw*.35}" y="${H-8}" font-size="10" fill="#6b7686" text-anchor="middle">${l}</text>`});
  const lg=`<div class="legend">${series.map(x=>`<span><span class="dot" style="background:${x.color}"></span>${x.name}</span>`).join('')}</div>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>${lg}`;
}

}

   <div class="card chartcard"><h3>Contractor FTE by Department (Finance-Sep Actuals)</h3><div class="note">FTE · share of ${CN.depts.reduce((a,d)=>a+d[1],0).toFixed(1)} FTE</div>${hBars(CN.depts.filter(d=>d[1]>0).map(d=>[d[0],d[1],'#7c3aed']),CN.depts.reduce((a,d)=>a+d[1],0))}</div></div>

function leavePage(){
  const L=LV, stT=sum(L.status.map(x=>x[1])), rsT=sum(L.reasons.map(x=>x[1]));
  const cs=[
   {label:'Leave Approval Rate',value:fmt.pct(L.approved/L.requests),type:'prop',sub:`${L.approved} of ${L.requests} requests approved or partially approved`},
   {label:'Leave Requests (YTD)',value:fmt.n(L.requests),type:'trk',sub:`Jan 1 – ${L.asOf}`},
   {label:'Employees on Approved Leave (YTD)',value:fmt.n(L.employeesApproved),type:'trk',sub:`${fmt.pct(L.employeesApproved/WFA.headcount)} of current headcount (${fmt.n(WFA.headcount)})`},
   {label:'On Leave Today',value:fmt.n(L.onLeaveToday),type:'trk',sub:`${fmt.pct(L.onLeaveToday/WFA.headcount)} of headcount · current ADP status`},
   {label:'Approved Leave Hours (YTD)',value:fmt.n(L.hours),type:'trk',sub:`${fmt.n(L.hours/L.approved)} hours per approved leave`},
   {label:'Intermittent Leave: Daily Approval %',value:fmt.pct(L.intermApproval),type:'prop',sub:`Active intermittent · avg ${L.intermHours} daily hours`}];
  return `<h2>Leave Administration</h2><p class="note">Employee Leave Analytics · 1/1/2026 – ${L.asOf} · aggregate counts</p>
  <div class="flag"><b>Proposed KPIs:</b> leave approval rate (approved + partially approved ÷ total requests) and intermittent leave daily approval %. Denial rate is ${fmt.pct(L.status[3][1]/L.requests)} and cancellations ${fmt.pct(L.status[2][1]/L.requests)}. Approved reason labels are truncated in the source; the largest is read as the employee's own condition and should be confirmed. The monthly request counts shown (563 total) don't sum to ${L.requests}; the source may count by a different date. *October is partial.</div>`+cards(cs)+
  `<div class="grid2" style="margin-top:12px">${chartCard('Monthly Leave Requests','From source trend chart',barChart(L.monthly.map(m=>m[0]),L.monthly.map(m=>m[1])))}
   <div class="card chartcard"><h3>Request Status</h3><div class="note">${fmt.n(L.requests)} requests</div>${hBars(L.status.map(x=>[x[0],x[1],x[2]]),L.requests)}</div>
   <div class="card chartcard"><h3>Approved Leave Reasons</h3><div class="note">${L.approved} approved leaves</div>${hBars(L.reasons.map((x,i)=>[x[0],x[1],i===0?'#2f7077':'#7c8fb3']),rsT)}</div></div>`;
}



function ratingsSection(){
  const R=PR,A=R.summary.annual,M=R.summary.mid, a=A.completed, m=M.completed;
  const d=(x,y,f)=>{const v=x-y;return (v>0?'+':v<0?'−':'')+f(Math.abs(v))};
  const cr=x=>x.completed/x.inReview;
  const hi=i=>R.dist[0][i]+R.dist[1][i], lo=i=>R.dist[3][i]+R.dist[4][i];
  const cs=[
   {label:'Review Completion Rate (Mid-Year 2026)',value:fmt.pct(cr(M)),type:'prop',sub:`${fmt.n(M.completed)} of ${fmt.n(M.inReview)} completed · ${M.pending} pending · Annual 2025: ${fmt.pct(cr(A))}`},
   {label:'Average Rating Score (0–5)',value:M.avg.toFixed(2),type:'prop',sub:`Mid-Year 2026 · median ${M.median.toFixed(2)} · Annual 2025: ${A.avg.toFixed(2)}`},
   {label:'Excelling + Exceptional',value:fmt.pct(hi(3)/m),type:'prop',sub:`${fmt.n(hi(3))} of ${fmt.n(m)} rated · Annual 2025: ${fmt.pct(hi(2)/a)}`},
   {label:'Contributing + Needs Development',value:fmt.pct(lo(3)/m),type:'trk',sub:`${fmt.n(lo(3))} of ${fmt.n(m)} rated · Annual 2025: ${fmt.pct(lo(2)/a)}`},
   {label:'Employees Rated (Mid-Year 2026)',value:fmt.n(m),type:'trk',sub:`Annual 2025: ${fmt.n(a)} rated`}];
  const distRows=R.dist.map(r=>{const p1=r[2]/a*100,p2=r[3]/m*100;return `<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span><b>${r[0]}</b> <span style="color:var(--mut)">${r[1]}</span></span><span>Mid-Year <b>${p2.toFixed(1)}%</b> (${r[3]}) <span style="color:var(--mut)">· Annual ${p1.toFixed(1)}% (${r[2]})</span></span></div>
   <div style="height:9px;background:#eceff4;border-radius:5px;margin-top:4px;overflow:hidden"><div style="width:${p2}%;height:100%;background:${r[4]}"></div></div>
   <div style="height:5px;background:#eceff4;border-radius:3px;margin-top:2px;overflow:hidden"><div style="width:${p1}%;height:100%;background:${r[4]};opacity:.45"></div></div></div>`}).join('');
  const grp=R.groups.map(g=>{const A1=g[1].annual,M1=g[1].mid;return `<tr><td>${g[0]}</td><td>${fmt.pct(A1.done/A1.total)}</td><td>${fmt.pct(M1.done/M1.total)}</td><td>${A1.avg.toFixed(2)}</td><td>${M1.avg.toFixed(2)}</td><td>${fmt.pct((A1.ex+A1.exl)/A1.done)}</td><td>${fmt.pct((M1.ex+M1.exl)/M1.done)}</td></tr>`}).join('');
  const dep=PERF_DEPT.slice().sort((x,y)=>(x[5]/x[4])-(y[5]/y[4])).map(r=>`<tr><td>${r[0]}</td><td>${fmt.n(r[4])}</td><td>${fmt.n(r[5])}</td><td>${r[6]}</td><td style="color:${r[5]/r[4]<0.8?'var(--r)':'inherit'}">${fmt.pct(r[5]/r[4])}</td><td>${r[3]==null?'—':r[3].toFixed(2)}</td><td>${r[7]==null?'—':r[7].toFixed(2)}</td></tr>`).join('');
  const rd=PERF_RATED_DEPT.slice().sort((x,y)=>((y[2]+y[3])/y[1])-((x[2]+x[3])/x[1])).map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${fmt.pct((r[2]+r[3])/r[1])}</td><td>${fmt.pct(r[4]/r[1])}</td><td>${fmt.pct((r[5]+r[6])/r[1])}</td></tr>`).join('');
  return `<h2>Performance Ratings</h2><p class="note">Annual 2025 and Mid-Year 2026 are separate review cycles (Mid-Year period Jan 1 – Jun 30, 2026) · rating scale 0–5.00 · aggregate counts only</p>
  <div class="flag"><b>Proposed KPIs:</b> review completion rate, average rating score, and % Excelling + Exceptional. The Mid-Year 2026 cycle covers about 900 more employees than Annual 2025 (2,321 vs 1,417), so compare cycles with care. Department detail is limited to groups with 5+ rated employees; average scores are hidden below that.</div>`+cards(cs)+
  `<div class="grid2" style="margin-top:12px"><div class="card chartcard"><h3>Rating Distribution</h3><div class="note">% of rated employees · thick bar = Mid-Year 2026, thin bar = Annual 2025</div>${distRows}</div>
   <div class="card chartcard"><h3>By Employee Group</h3><div class="note">Completion, average score, and % Excelling + Exceptional</div><table><tr><th>Group</th><th>Compl. Annual</th><th>Compl. Mid</th><th>Avg Annual</th><th>Avg Mid</th><th>% Top Annual</th><th>% Top Mid</th></tr>${grp}</table></div></div>
  <div class="grid2" style="margin-top:12px"><div class="card chartcard"><h3>Mid-Year Completion by Department</h3><div class="note">Sorted by lowest completion · red below 80%</div><table><tr><th>Department</th><th>In Review</th><th>Done</th><th>Pending</th><th>Compl.</th><th>Avg Annual</th><th>Avg Mid</th></tr>${dep}</table></div>
   <div class="card chartcard"><h3>Mid-Year Ratings by Department</h3><div class="note">Departments with 5+ rated · sorted by % Excelling + Exceptional</div><table><tr><th>Department</th><th>Rated</th><th>% Excelling+</th><th>% Performing</th><th>% Contrib./Needs Dev.</th></tr>${rd}</table></div></div>`;
}

function pmSection(){
  const P=PM;
  const pipRec=P.actions[3][1];
  const cs=[
   {label:'PIPs Initiated',value:fmt.n(pipRec),type:'prop',sub:`${P.pipInitiatedEmployees} employees · ${P.actions[4][1]} extensions · since May`},
   {label:'Employees with a Warning or PIP',value:fmt.n(P.employees),type:'prop',sub:`${P.records} records · May – Oct 2026`},
   {label:'Final Warnings Issued',value:fmt.n(P.actions[1][1]),type:'trk',sub:`${P.actions[0][1]} written warnings · ${P.actions[2][1]} suspensions`},
   {label:'Employees No Longer Active After Action',value:fmt.pct(P.empDeact/P.employees),type:'trk',sub:`${P.empDeact} of ${P.employees} deactivated (terminated) · ${P.empActive} still active`},
   {label:'PIP Employees No Longer Active',value:fmt.pct(P.pipDeact/P.pipEmployees),type:'trk',sub:`${P.pipDeact} of ${P.pipEmployees} employees with a PIP · not causal`}];
  const rows=P.actions.map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${a[3]}</td><td>${fmt.pct(a[3]/a[1])}</td></tr>`).join('');
  const catT=sum(P.cats.map(c=>c[1]));
  return `<h2>Performance Management — PIPs &amp; Warnings</h2><p class="note">PIPs and corrective actions · HR Acuity (tracking began May 2026) · records opened May 6 – Oct 21, 2026 · refreshed ${P.asOf} · aggregate counts only</p>
  <div class="flag"><b>Proposed KPIs:</b> PIPs initiated and employees with a warning or PIP. There is no history before May. "No longer active" means the employee profile is deactivated (terminated) as of today for any reason, not necessarily as a result of the action. Issue categories are grouped from HR Acuity sub-categories; roughly 39% of records are performance-related and the rest are attendance and conduct. *October is partial.</div>`+cards(cs)+

   {label:'Academy Trainer Satisfaction (1–5)',value:A.evalTotal[2].toFixed(2),type:'trk',sub:'Facilitator question, Aug – today'},
   {label:'Academy Enrollment',value:fmt.n(enr),type:'trk',sub:`${C.length} classes · ${ns} no-shows (${fmt.pct(ns/enr)})`},
   {label:'Terminations During Academy',value:fmt.n(tm),type:'trk',sub:`${fmt.pct(tm/att)} of participants who started the Academy`}];
  const crow=C.map(c=>{const a=c[1]-c[2];return `<tr><td style="text-align:left">${c[0]}</td><td>${c[1]}</td><td>${c[2]||'—'}</td><td>${a}</td><td>${c[3]}</td><td>${c[4]}</td><td><b>${fmt.pct(c[3]/a)}</b></td></tr>`}).join('');
  const erow=A.evals.map(e=>`<tr><td style="text-align:left">${e[0]}</td><td>${e[1]}</td><td>${e[2].toFixed(2)}</td><td>${e[3].toFixed(2)}</td></tr>`).join('');
  return `<h2 style="font-size:13px;color:var(--mut)">L&amp;D Overall</h2>`+cards(cs)+
  `<h2 style="font-size:13px;color:var(--mut);margin-top:16px">Academy (shared with all HR)</h2>
  <div class="flag"><b>Academy graduation rate</b> = graduates ÷ (enrollment − no-shows). <b>Academy penetration</b> = participants (enrollment − no-shows) ÷ new hires in PAS and CSR roles (the Academy's target population) since it launched in March (458 hires Mar – Oct; 647 YTD for the full year; target TBD, possibly 20%). The table covers all 6 Academy classes to date. Each Academy survey response is one learner's evaluation of one session, so counts are much higher than the number of learners; scores are 1–5 averages, not % favorable. Class results come from a screenshot.</div>`+cards(acs)+
  `<div class="grid2" style="margin-top:12px"><div class="card chartcard"><h3>Academy Class Results</h3><div class="note">Graduation rate vs enrollment less no-shows</div><table><tr><th style="text-align:left">Start Date</th><th>Enrolled</th><th>No Shows</th><th>Attended</th><th>Graduated</th><th>Term</th><th>Grad Rate</th></tr>${crow}<tr><th style="text-align:left">Total</th><th>${enr}</th><th>${ns}</th><th>${att}</th><th>${gr}</th><th>${tm}</th><th>${fmt.pct(gr/att)}</th></tr></table></div>
   ${chartCard('Graduation Rate by Class','% of enrollment less no-shows',barChart(C.map(c=>c[0]),C.map(c=>Math.round(c[3]/(c[1]-c[2])*1000)/10),{f:v=>v.toFixed(0)+'%',color:'#1f9d63'}))}
   <div class="card chartcard"><h3>Academy Evaluations (1–5 scale)</h3><div class="note">A2T2 end-of-course survey · evaluations, not learners</div><table><tr><th style="text-align:left">Month</th><th>Responses</th><th>Overall Effectiveness</th><th>Trainer Satisfaction (Facilitator)</th></tr>${erow}<tr><th style="text-align:left">Aug – today</th><th>${A.evalTotal[0]}</th><th>${A.evalTotal[1].toFixed(2)}</th><th>${A.evalTotal[2].toFixed(2)}</th></tr></table></div></div>`;
}

function ldPage(){
  const L=LD, tg={label:'90% favorable',green:0.9,yellow:0.8};
  const kcs=[
   {label:'Facilitator Effectiveness',value:null,type:'kpi',target:tg,sub:`% favorable (Agree / Strongly Agree) · Business Training · avg score ${L.program.total[1].toFixed(2)} / 5`},
   {label:'Facilitator Satisfaction',value:null,type:'kpi',target:tg,sub:`% favorable · Business Training · avg score ${L.program.total[2].toFixed(2)} / 5`},
   {label:'Welcome Orientation Participation',value:null,type:'kpi',target:tg,sub:'New hires attended ÷ scheduled, monthly · attendance data not yet provided'},
   {label:'Welcome Orientation Satisfaction',value:null,type:'kpi',target:tg,sub:`% favorable · avg score ${L.wo.total[1].toFixed(2)} / 5`},
   {label:'Fifth Facilitation KPI',value:null,type:'ph',sub:'Definition not yet provided'}];
  const tcs=[
   {label:'Program Training: Overall Effectiveness',value:L.program.total[1].toFixed(2),type:'trk',sub:`Avg of 9 questions · ${L.program.total[0]} responses · 1–5 scale`},
   {label:'Program Training: Trainer (Facilitator) Satisfaction',value:L.program.total[2].toFixed(2),type:'trk',sub:'Avg of 3 facilitator questions · 1–5 scale'},
   {label:'Welcome Orientation: Overall Effectiveness',value:L.wo.total[1].toFixed(2),type:'trk',sub:`Avg of 8 questions · ${L.wo.total[0]} responses · 1–5 scale`},
   {label:'Welcome Orientation: Trainer (Ambassador) Satisfaction',value:L.wo.total[2].toFixed(2),type:'trk',sub:'Avg of 2 ambassador questions · 1–5 scale'}];
  const bar=v=>v==null?'<span style="color:var(--mut)">n/a</span>':`<div style="display:flex;align-items:center;gap:6px;justify-content:flex-end"><div class="bar" style="width:70px;margin:0"><i style="width:${v/5*100}%"></i></div><b>${v.toFixed(2)}</b></div>`;
  const tbl=(t,lab)=>`<table><tr><th>Month</th><th>Responses</th><th>Overall Effectiveness</th><th>${lab}</th></tr>${t.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${bar(r[2])}</td><td>${bar(r[3])}</td></tr>`).join('')}<tr><th>Aug – today</th><th>${t.total[0]}</th><th>${t.total[1].toFixed(2)}</th><th>${t.total[2].toFixed(2)}</th></tr></table>`;
  return `<h2>Learning &amp; Development</h2><p class="note">Overall, Academy program, facilitation, instructional design, professional development</p>`+ldOverviewAcademy()+`
  <h2 style="font-size:13px;color:var(--mut);margin-top:20px">Facilitation</h2><p class="note">Level 1 survey · August 2026 through ${L.asOf}</p>
  <div class="flag"><b>Targets set (90%) but data not yet in the KPI format:</b> the KPIs are defined as % of responses favorable (Agree or Strongly Agree), but the survey results provided are 1–5 averages (5 = Strongly Agree), so % favorable can't be calculated. Averages are shown below as Tracking. Send % favorable (or the response-level counts) and attendance for Welcome Orientation to populate the KPIs. Only four of the five facilitation KPIs were listed; the fifth is a placeholder.</div>`+cards(kcs)+
  `<h2 style="font-size:13px;color:var(--mut);margin-top:16px">Level 1 Results (1–5 scale)</h2>`+cards(tcs)+
  `<div class="grid2" style="margin-top:12px"><div class="card chartcard"><h3>Program Training (excludes Academy)</h3><div class="note">Overall effectiveness and trainer (facilitator) satisfaction</div>${tbl(L.program,'Trainer Satisfaction (Facilitator)')}<ul class="m"><li>No program training classes were held in October; only Academy classes were supported.</li></ul></div>
   <div class="card chartcard"><h3>Welcome Orientation</h3><div class="note">Overall effectiveness and trainer (ambassador) satisfaction</div>${tbl(L.wo,'Trainer Satisfaction (Ambassador)')}<ul class="m"><li>No orientations were held in October; 5 late-October submissions are counted in September.</li></ul></div></div>
  <div class="card" style="margin-top:12px"><h3 style="margin:0 0 4px;font-size:13px">Definitions</h3><ul class="m"><li>Overall effectiveness = average of all rated questions (Program: 9 questions; Welcome Orientation: 8 questions).</li><li>Trainer satisfaction = Program: average of 3 facilitator questions; Welcome Orientation: average of 2 ambassador questions.</li><li>Aug – today rows are pooled across all responses.</li></ul></div>
  <h2 style="font-size:13px;color:var(--mut)">Instructional Design</h2><p class="note">Business Training content · no data yet · 5 KPIs defined</p>
  <div class="flag">Instructional Design KPIs are defined but no data has been provided. Two are future-state KPIs (objective alignment; annual maintenance, planned for 2027), and three are waiting on an Excel-style format from the L&amp;D lead. Content effectiveness and satisfaction will pull from Absorb and A2T2 combined.</div>`+
  cards([{label:'Objective Alignment of Content & L2 Assessments',value:null,type:'ph',target:{label:'90% · new courses with aligned content and L2 assessment ÷ new courses reviewed, monthly'},sub:'Future state · process to be brainstormed'},
   {label:'Template Compliance',value:null,type:'kpi',target:{label:'+10 pts month over month until 90% · programs converted to the new template ÷ programs in portfolio, monthly'},sub:'Awaiting data · format to be provided'},
   {label:'Content Effectiveness',value:null,type:'kpi',target:{label:'90% favorable (Agree / Strongly Agree) on content effectiveness items, monthly'},sub:'Awaiting data · Absorb + A2T2 combined'},
   {label:'Content Satisfaction',value:null,type:'kpi',target:{label:'90% favorable (Agree / Strongly Agree) on content satisfaction items, monthly'},sub:'Awaiting data · Absorb + A2T2 combined'},
   {label:'Annual Maintenance',value:null,type:'ph',target:{label:'90% · annual reviews completed ÷ due, year-to-date rate tracked monthly'},sub:'Future state 2027 · after process documentation'}])+
  `<h2 style="font-size:13px;color:var(--mut)">Professional Development</h2><p class="note">PD series L1 surveys (MS Forms) · 6 surveys listed · 3 loaded, 1 screenshot only, 2 pending</p>`+pdSection();
}


function hrisPage(){
  const H=HRIS, col={'Fully Implemented':'var(--g)','In Progress':'#2b5fd9','In Procurement':'var(--y)','Not Started':'#b4bcc9'};
  const cnt=k=>H.projects.filter(p=>p[1]===k).length;
  const sc={'Available':'var(--g)','Partial':'var(--y)','Gap':'var(--r)'};
  const K=HK.kpis, byN=n=>K.find(k=>k[0]===n);
  const kcard=(n,label,value,sub)=>{const k=byN(n);return {label,value,type:'prop',sub:value==null?`Data status: ${k[5]} · ${k[6]}`:sub}};
  const cs=[
   kcard(1,'New Hires (Sep 2026)',fmt.n(53),'ADP onboarding export'),
   kcard(2,'Onboarding Experience Completion Rate',fmt.pct(43/53),'43 of 53 external hires completed · 5 in progress · 5 not started'),
   kcard(5,'ADP Term Tickets Sent (Oct 1–20)',fmt.n(152),'2 still open as of Oct 20'),
   kcard(6,'HRIS Issues Resolved (last 30 days)',fmt.n(855),'Sep 21 – Oct 20 · 24 active days'),
   kcard(7,'HRIS Resolution Time, Total (last 30 days)',fmt.n(2164)+' days','Across 855 resolved issues'),
   kcard(8,'HRIS Average Resolution Time',(2164/855).toFixed(1)+' days','Last 30 days · last 7 days (Oct 14–20): 3.7 · Sep 21–Oct 13: 2.2'),
   kcard(3,'Onboarding Compliance (Audited Profiles)',null),
   kcard(4,'Internal Move Hire Execution Time',null),
   kcard(9,'Data Entry Error Rate',null),
   kcard(10,'ADP Spot-Check Pass Rate',null),
   kcard(14,'VerifyComply Monthly Census Compliance Rate',null)];
  const krows=K.map(k=>`<tr><td>${k[0]}</td><td style="text-align:left">${k[1]}</td><td style="text-align:left"><b>${k[2]}</b></td><td style="text-align:left;font-size:11px">${k[3]}</td><td style="text-align:left;font-size:11px">${k[4]}</td><td style="text-align:left"><span class="dot" style="background:${sc[k[5]]}"></span>${k[5]}</td><td style="text-align:left;font-size:11px;color:var(--mut)">${k[6]}</td></tr>`).join('');
  const rows=H.projects.map(p=>`<tr><td style="text-align:left"><b>${p[0]}</b></td><td style="text-align:left"><span class="dot" style="background:${col[p[1]]}"></span>${p[1]}</td><td>${p[2]||'—'}</td><td style="text-align:left;color:var(--mut)">${p[3]||''}</td></tr>`).join('');
  const pcs=[{label:'HRIS Projects',value:fmt.n(H.projects.length),type:'sta',sub:`As of ${H.asOf}`},{label:'Fully Implemented',value:fmt.n(cnt('Fully Implemented')),type:'sta',sub:'HR Acuity (May 2026) · iCIMS (Aug 2026)'},{label:'In Progress / In Procurement',value:fmt.n(cnt('In Progress')+cnt('In Procurement')),type:'sta',sub:'Career Site Landing Pages · EverCheck'},{label:'Not Started',value:fmt.n(cnt('Not Started')),type:'sta',sub:'Snowflake Integration'}];
  return `<h2>HRIS</h2><h2 style="font-size:13px;color:var(--mut)">KPIs</h2><p class="note">11 Tier 1 KPIs, reported monthly · 6 have data, 5 are partial or gaps (shown as Awaiting data with the data status)</p>
  <div class="flag"><b>Notes:</b> "New hires" here (53 for September) comes from the ADP onboarding export and may differ from the 65 September hires in Workforce Analytics, which use a different source and definition. Time-window figures (term tickets Oct 1–20; HRIS queue last 30 days) are partial periods and will update as data refreshes. KPI numbers are shown as listed in the HRIS KPI overview (#1–10 and #14).</div>`+cards(cs)+
  `<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px;font-size:13px">HRIS KPI Definitions &amp; Data Status</h3><table><tr><th>#</th><th style="text-align:left">Area</th><th style="text-align:left">KPI</th><th style="text-align:left">Measure</th><th style="text-align:left">Data Source</th><th style="text-align:left">Data Status</th><th style="text-align:left">Supporting Data</th></tr>${krows}</table></div>
  <h2 style="font-size:13px;color:var(--mut);margin-top:20px">Project Updates</h2><p class="note">Non-measurable items, reported as status rather than KPIs · as of ${H.asOf}</p>`+cards(pcs)+
  `<div class="card" style="margin-top:12px"><table><tr><th style="text-align:left">Project</th><th style="text-align:left">Status</th><th>Implementation / Target Date</th><th style="text-align:left">Note</th></tr>${rows}</table></div>`;
}
function ph(title,items){return `<h2>${title}</h2>`+placeholder('Awaiting data',items)}
const PH={
 'HR Events':ph('HR Events','Lunch & learns hosted · Benefit fair · Flu clinics')
};

function body(){
  const p=state.page;
  const pg=PAGES.find(x=>x.id===p); const name=pg.subs[state.sub[p]];
  if(p==='rewards'&&name==='Wellness') return benefitsDeep();
  if(p==='rewards'&&name==='Compensation & Bonus') return compBonusPage();
  if(p==='culture'&&name==='Engagement Survey') return engagementPage();
  if(p==='culture'&&name==='ERGs') return ergPage();
  if(p==='ops'&&name==='Workforce Analytics') return wfaPage();
  if(p==='ops'&&name==='HRIS') return hrisPage();
  if(p==='rewards'&&name==='Leaves') return leavePage();
  if(p==='rewards'&&name==='Rewards & Recognition') return recognitionPage();
  if(p==='rewards'&&name==='Benefits') return benefitsPage();
  if(p==='ops'&&name==='HR Operations') return opsPage();
  if(p==='talent'&&name==='Talent') return talentPage();
  if(p==='talent'&&name==='Learning & Development') return ldPage();
  if(p==='talent'&&name==='Employee Relations') return erPage();
  if(p==='talent'&&name==='Performance') return performancePage();
  if(p==='talent'&&name==='Talent Acquisition') return talentAcqPage();
  if(p==='talent'&&name==='Redeployments') return redeployPage();
  return PH[name];
}
function render(){
  $('#nav').innerHTML=PAGES.map(p=>`<button class="${p.id===state.page?'on':''}" onclick="go('${p.id}')">${p.name}</button>`).join('');
  const pg=PAGES.find(x=>x.id===state.page);
  const sub=pg.subs?`<div class="sub">${pg.subs.map((s,i)=>`<button class="${i===state.sub[pg.id]?'on':''}" onclick="goSub(${i})">${s}</button>`).join('')}</div>`:'';
  $('#main').innerHTML=sub+body();
  $('#asof').textContent='HealthiestYou data through '+HY.months[n]+' 2026';
  window.scrollTo(0,0);
}
function go(id){state.page=id;render()}
function goSub(i){state.sub[state.page]=i;render()}
function printView(mode){
  const keep={page:state.page,sub:Object.assign({},state.sub)};
  let items=[];
  PAGES.forEach(p=>{
    if(mode!=='all'&&p.id!==state.page)return;
    (p.subs||[null]).forEach((n,i)=>{ if(mode==='tab'&&i!==state.sub[p.id])return; items.push([p,i,n]); });
  });
  let html='';
  items.forEach(([p,i,n])=>{state.page=p.id;if(n)state.sub[p.id]=i;html+=`<section class="pgbrk"><div class="psec">${p.name}${n?' · '+n:''}</div>${body()}</section>`;});
  Object.assign(state,{page:keep.page,sub:keep.sub});
  $('#main').innerHTML=html;
  const done=()=>{window.removeEventListener('afterprint',done);render()};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),100);
}
render();
</script>
